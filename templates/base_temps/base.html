<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CommandKeeper{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent-strong: #16a34a;
            --border: #1f2937;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #0b1221 0%, #0f172a 40%, #0b1221 100%);
            color: var(--text);
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-strong); }
        header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .container { max-width: 1080px; margin: 0 auto; padding: 0 1.25rem; }
        main { padding: 2rem 0 3rem; }
        .card { background: radial-gradient(circle at 20% 20%, rgba(34,197,94,0.08), transparent 25%), radial-gradient(circle at 80% 0%, rgba(59,130,246,0.06), transparent 30%), linear-gradient(145deg, rgba(17,24,39,0.95), rgba(15,23,42,0.95)); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.35); }
        .card + .card { margin-top: 1.5rem; }
        .pill { display: inline-flex; align-items: center; gap: 6px; padding: 0.2rem 0.65rem; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.85rem; }
        .pill.info { color: #38bdf8; border-color: rgba(56,189,248,0.3); }
        .pill.warning { color: #fbbf24; border-color: rgba(251,191,36,0.35); }
        .pill.error { color: #f87171; border-color: rgba(248,113,113,0.35); }
        .pill.critical { color: #f43f5e; border-color: rgba(244,63,94,0.35); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.9rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .muted { color: var(--muted); }
        .field { display: flex; flex-direction: column; gap: 0.35rem; }
        .field label { font-size: 0.9rem; color: var(--muted); }
        .field input, .field select { padding: 0.65rem 0.75rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text); }
        .field input:focus, .field select:focus { outline: 2px solid rgba(34,197,94,0.35); border-color: var(--accent); }
        .actions { display: flex; gap: 0.75rem; align-items: center; }
        .btn { padding: 0.75rem 1rem; border-radius: 10px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: transform 80ms ease, box-shadow 120ms ease; }
        .btn-primary { background: var(--accent); color: #052e16; border-color: var(--accent-strong); box-shadow: 0 10px 30px rgba(34,197,94,0.35); }
        .btn-primary:hover { background: var(--accent-strong); transform: translateY(-1px); }
        .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); font-size: 0.85rem; }
        .grid { display: grid; gap: 1rem; }
        @media(min-width: 720px) { .grid-cols-3 { grid-template-columns: 2fr 1fr 1fr; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        {% include 'base_temps/navbar.html' %}
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
